<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telangana Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>🌤️ Telangana Weather Dashboard</h1>

            <button id="themeBtn">🌙</button>
        </header>


        <!-- Telangana District Search -->
        <div class="search-box">

            <select id="cityInput">

                <option value="">Select Telangana District</option>

                <option value="Adilabad">Adilabad</option>

                <option value="Bhadradri Kothagudem">
                    Bhadradri Kothagudem
                </option>

                <option value="Hanamkonda">
                    Hanamkonda
                </option>

                <option value="Hyderabad">
                    Hyderabad
                </option>

                <option value="Jagtial">
                    Jagtial
                </option>

                <option value="Jangaon">
                    Jangaon
                </option>

                <option value="Jayashankar Bhupalpally">
                    Jayashankar Bhupalpally
                </option>

                <option value="Jogulamba Gadwal">
                    Jogulamba Gadwal
                </option>

                <option value="Kamareddy">
                    Kamareddy
                </option>

                <option value="Karimnagar">
                    Karimnagar
                </option>

                <option value="Khammam">
                    Khammam
                </option>

                <option value="Komaram Bheem">
                    Komaram Bheem
                </option>

                <option value="Mahabubabad">
                    Mahabubabad
                </option>

                <option value="Mahabubnagar">
                    Mahabubnagar
                </option>

                <option value="Mancherial">
                    Mancherial
                </option>

                <option value="Medak">
                    Medak
                </option>

                <option value="Medchal Malkajgiri">
                    Medchal Malkajgiri
                </option>

                <option value="Mulugu">
                    Mulugu
                </option>

                <option value="Nagarkurnool">
                    Nagarkurnool
                </option>

                <option value="Nalgonda">
                    Nalgonda
                </option>

                <option value="Narayanpet">
                    Narayanpet
                </option>

                <option value="Nirmal">
                    Nirmal
                </option>

                <option value="Nizamabad">
                    Nizamabad
                </option>

                <option value="Peddapalli">
                    Peddapalli
                </option>

                <option value="Rajanna Sircilla">
                    Rajanna Sircilla
                </option>

                <option value="Rangareddy">
                    Rangareddy
                </option>

                <option value="Sangareddy">
                    Sangareddy
                </option>

                <option value="Siddipet">
                    Siddipet
                </option>

                <option value="Suryapet">
                    Suryapet
                </option>

                <option value="Vikarabad">
                    Vikarabad
                </option>

                <option value="Wanaparthy">
                    Wanaparthy
                </option>

                <option value="Warangal">
                    Warangal
                </option>

                <option value="Yadadri Bhuvanagiri">
                    Yadadri Bhuvanagiri
                </option>

            </select>

            <button id="searchBtn">
                🔍 Search Weather
            </button>

        </div>


        <!-- Error / Loading Message -->
        <p id="error" role="status" aria-live="polite"></p>


        <!-- Current Weather -->
        <section class="weather-card">

            <div class="location">

                <h2 id="cityName">
                    Select a District
                </h2>

                <p id="date"></p>

            </div>


            <div class="current-weather">

                <div class="weather-icon">

                    <img id="weatherIcon" alt="Weather Icon" style="display:none">

                </div>


                <div>

                    <h2 id="temperature">
                        --°C
                    </h2>

                    <p id="condition">
                        Select a district to view weather
                    </p>

                </div>

            </div>


            <!-- Weather Details -->
            <div class="details">

                <div class="detail-box">

                    <span>🌡️</span>

                    <p>
                        Feels Like
                    </p>

                    <strong id="feelsLike">
                        --°C
                    </strong>

                </div>


                <div class="detail-box">

                    <span>💧</span>

                    <p>
                        Humidity
                    </p>

                    <strong id="humidity">
                        --%
                    </strong>

                </div>


                <div class="detail-box">

                    <span>💨</span>

                    <p>
                        Wind
                    </p>

                    <strong id="wind">
                        -- km/h
                    </strong>

                </div>


                <div class="detail-box">

                    <span>🔽</span>

                    <p>
                        Pressure
                    </p>

                    <strong id="pressure">
                        -- hPa
                    </strong>

                </div>

            </div>

        </section>


        <!-- Forecast -->
        <section class="forecast-section">

            <h2>
                5-Day Forecast
            </h2>


            <div
                id="forecast"
                class="forecast-container"
            >

                <!-- JavaScript adds forecast cards here -->

            </div>

        </section>


        <!-- Footer -->
        <footer>

            <p>
                Telangana Weather Dashboard |
                Built with HTML, CSS &amp; JavaScript
            </p>

            <p>
                Weather data provided by
                <a
                    href="https://open-meteo.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >Open-Meteo API</a>
            </p>

        </footer>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
